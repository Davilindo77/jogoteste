<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Survival Melhorado</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#ui {
position:absolute;
top:10px;
left:10px;
color:white;
font-family:sans-serif;
}

#crosshair {
position:absolute;
top:50%;
left:50%;
width:6px;
height:6px;
background:white;
transform:translate(-50%,-50%);
border-radius:50%;
}
</style>

</head>
<body>

<div id="ui"></div>
<div id="crosshair"></div>

<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.160.0/build/three.module.js"
}
}
</script>

<script type="module">
import * as THREE from 'three';

// ===== CENA =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, 120);

// câmera
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

// renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.7;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// luz
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(50,100,50);
scene.add(sun);

scene.add(new THREE.HemisphereLight(0x87ceeb,0x444444,1));

// ===== TERRENO COM ONDULAÇÃO REAL =====
const size = 200;
const geo = new THREE.PlaneGeometry(size,size,100,100);

for(let i=0;i<geo.attributes.position.count;i++){
let x = geo.attributes.position.getX(i);
let z = geo.attributes.position.getY(i);

let y = Math.sin(x*0.05)*2 + Math.cos(z*0.05)*2;
geo.attributes.position.setZ(i, y);
}

geo.computeVertexNormals();

const ground = new THREE.Mesh(
geo,
new THREE.MeshStandardMaterial({color:0x3f8f4f})
);

ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ===== PLAYER =====
let velocity = new THREE.Vector3();
let keys = {};
let stamina = 100;

// ===== INVENTÁRIO =====
let inv = {wood:0, stone:0};

// ===== RECURSOS =====
let resources = [];

function createTree(x,z){
const g = new THREE.Group();

const trunk = new THREE.Mesh(
new THREE.CylinderGeometry(0.3,0.4,2),
new THREE.MeshStandardMaterial({color:0x5a3825})
);
trunk.position.y = 1;
g.add(trunk);

const leaves = new THREE.Mesh(
new THREE.SphereGeometry(1.5),
new THREE.MeshStandardMaterial({color:0x1f7a3a})
);
leaves.position.y = 3;
g.add(leaves);

g.position.set(x,0,z);
scene.add(g);

resources.push({mesh:g,type:"wood",hp:4});
}

function createRock(x,z){
const m = new THREE.Mesh(
new THREE.DodecahedronGeometry(1),
new THREE.MeshStandardMaterial({color:0x888888})
);
m.position.set(x,1,z);
scene.add(m);

resources.push({mesh:m,type:"stone",hp:4});
}

// spawn
for(let i=0;i<100;i++){
createTree((Math.random()-0.5)*size,(Math.random()-0.5)*size);
createRock((Math.random()-0.5)*size,(Math.random()-0.5)*size);
}

// ===== CONTROLES =====
document.body.onclick = ()=>document.body.requestPointerLock();

let rotX=0, rotY=0;

document.addEventListener("mousemove", e=>{
if(document.pointerLockElement){
rotY -= e.movementX*0.002;
rotX -= e.movementY*0.002;
rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
}
});

document.addEventListener("keydown", e=>keys[e.code]=true);
document.addEventListener("keyup", e=>keys[e.code]=false);

// ===== RAYCAST (MIRA REAL) =====
const raycaster = new THREE.Raycaster();

function getTarget(){
raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
const intersects = raycaster.intersectObjects(resources.map(r=>r.mesh), true);
return intersects[0];
}

// ===== LOOP =====
function animate(){
requestAnimationFrame(animate);

camera.rotation.x = rotX;
camera.rotation.y = rotY;

// movimento fluido
let speed = 0.15;

if(keys["ShiftLeft"] && stamina>0){
speed = 0.3;
stamina -= 0.5;
} else stamina += 0.3;

stamina = Math.max(0,Math.min(100,stamina));

if(keys["KeyW"]) camera.translateZ(-speed);
if(keys["KeyS"]) camera.translateZ(speed);
if(keys["KeyA"]) camera.translateX(-speed);
if(keys["KeyD"]) camera.translateX(speed);

// bater recurso (CLICK)
if(keys["KeyE"]){
let hit = getTarget();

if(hit && hit.distance < 4){
let obj = resources.find(r=>r.mesh===hit.object.parent || r.mesh===hit.object);

if(obj){
obj.hp--;

// efeito de hit (balançar)
obj.mesh.rotation.y += 0.2;

if(obj.hp<=0){
inv[obj.type]++;
scene.remove(obj.mesh);
resources = resources.filter(r=>r!==obj);
}
}
}
}

// UI
document.getElementById("ui").innerHTML =
`⚡ Stamina: ${Math.floor(stamina)}<br>
🌲 Madeira: ${inv.wood}<br>
🪨 Pedra: ${inv.stone}<br><br>
E = bater`;

renderer.render(scene,camera);
}

animate();

</script>
</body>
</html>
