<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Visual Upgrade</title>

<style>
body { margin:0; overflow:hidden; background:#87b97f; touch-action:none; }

#ui {
position:absolute;
top:10px;
left:10px;
color:white;
font-family:sans-serif;
text-shadow:2px 2px 4px black;
}

#joystick {
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
}

#stick {
position:absolute;
width:60px;
height:60px;
left:30px;
top:30px;
border-radius:50%;
background:rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<div id="ui">🌲 Explorando floresta...</div>
<div id="joystick"><div id="stick"></div></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b97f);
scene.fog = new THREE.Fog(0x87b97f, 40, 200);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* LIGHTING (MELHORADO) */
scene.add(new THREE.AmbientLight(0xbfdac5,0.6));

const sun = new THREE.DirectionalLight(0xffe6b0,1.5);
sun.position.set(30,50,20);
sun.castShadow = true;
scene.add(sun);

/* GROUND COM TEXTURA */
const loader = new THREE.TextureLoader();
const grassTex = loader.load("https://threejs.org/examples/textures/terrain/grasslight-big.jpg");
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(40,40);

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
new THREE.MeshStandardMaterial({map:grassTex})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* PLAYER */
const player = new THREE.Group();

const body = new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1),
new THREE.MeshStandardMaterial({color:0x2d5a27})
);

const head = new THREE.Mesh(
new THREE.SphereGeometry(0.35),
new THREE.MeshStandardMaterial({color:0xffcc99})
);

head.position.y = 1.2;
player.add(body, head);
scene.add(player);

/* 🌲 ÁRVORES MELHORADAS */
function createTree(x,z){
const tree = new THREE.Group();

const trunk = new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,3),
new THREE.MeshStandardMaterial({color:0x6b4423})
);

const leaves = new THREE.Mesh(
new THREE.SphereGeometry(1.5 + Math.random()),
new THREE.MeshStandardMaterial({
color: new THREE.Color().setHSL(0.3, 0.6, 0.3 + Math.random()*0.2)
})
);

leaves.position.y = 2.5;

tree.add(trunk, leaves);
tree.position.set(x,1,z);

trunk.castShadow = true;
leaves.castShadow = true;

scene.add(tree);
}

for(let i=0;i<120;i++){
createTree((Math.random()-0.5)*400,(Math.random()-0.5)*400);
}

/* 🪨 PEDRAS MELHORADAS */
for(let i=0;i<80;i++){
const rock = new THREE.Mesh(
new THREE.DodecahedronGeometry(0.6 + Math.random()),
new THREE.MeshStandardMaterial({color:0x777777, roughness:1})
);

rock.position.set(
(Math.random()-0.5)*400,
0.5,
(Math.random()-0.5)*400
);

rock.scale.y *= 0.6;

rock.castShadow = true;
scene.add(rock);
}

/* 🌱 GRAMA (DETALHE QUE FAZ DIFERENÇA) */
for(let i=0;i<200;i++){
const grass = new THREE.Mesh(
new THREE.PlaneGeometry(1,1),
new THREE.MeshBasicMaterial({color:0x3a7a3a, side:THREE.DoubleSide})
);

grass.position.set(
(Math.random()-0.5)*400,
0.5,
(Math.random()-0.5)*400
);

grass.rotation.y = Math.random()*Math.PI;
scene.add(grass);
}

/* INPUT */
let inputX=0,inputZ=0;
const keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* JOYSTICK */
const stick=document.getElementById("stick");
const joystick=document.getElementById("joystick");

let dragging=false,center={x:0,y:0};

joystick.addEventListener("touchstart",()=>{
dragging=true;
const r=joystick.getBoundingClientRect();
center.x=r.left+r.width/2;
center.y=r.top+r.height/2;
});

addEventListener("touchmove",e=>{
if(!dragging) return;
const t=e.touches[0];

let dx=t.clientX-center.x;
let dy=t.clientY-center.y;

const max=40;
const dist=Math.hypot(dx,dy);

if(dist>max){ dx*=max/dist; dy*=max/dist; }

stick.style.transform=`translate(${dx}px,${dy}px)`;

inputX=dx/max;
inputZ=-(dy/max);
});

addEventListener("touchend",()=>{
dragging=false;
inputX=0;
inputZ=0;
stick.style.transform="translate(0,0)";
});

/* MOVIMENTO (mantido estável) */
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();

function updateMovement(){
let kx=(keys["d"]?1:0)-(keys["a"]?1:0);
let kz=(keys["w"]?1:0)-(keys["s"]?1:0);

let x=dragging?inputX:kx;
let z=dragging?inputZ:kz;

const forward=new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y=0;
forward.normalize();

const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

direction.set(0,0,0);
direction.addScaledVector(forward,z);
direction.addScaledVector(right,x);

if(direction.length()>0) direction.normalize();

velocity.lerp(direction.multiplyScalar(0.2),0.2);
player.position.add(velocity);

if(velocity.length()>0.01){
const angle=Math.atan2(velocity.x,velocity.z);
player.rotation.y += (angle-player.rotation.y)*0.2;
}
}

/* CAMERA */
function updateCamera(){
const offset=new THREE.Vector3(0,4,-7);
const target=player.position.clone().add(offset);

camera.position.lerp(target,0.1);
camera.lookAt(player.position);
}

/* LOOP */
function animate(){
requestAnimationFrame(animate);
updateMovement();
updateCamera();
renderer.render(scene,camera);
}
animate();

/* RESIZE */
addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
