<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Survival</title>

<style>
body { margin:0; overflow:hidden; background:#87b97f; touch-action:none; }

#ui {
position:absolute;
top:10px;
left:10px;
color:white;
font-family:sans-serif;
text-shadow:2px 2px 4px black;
}

#joystick {
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
}

#stick {
position:absolute;
width:60px;
height:60px;
left:30px;
top:30px;
border-radius:50%;
background:rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<div id="ui">
🌲 Madeira: <span id="wood">0</span><br>
🪨 Pedra: <span id="stone">0</span><br>
🔥 Objetivo: 20 madeira + 10 pedra
</div>

<div id="joystick"><div id="stick"></div></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b97f);
scene.fog = new THREE.Fog(0x87b97f, 30, 150);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff,0.7));

const sun = new THREE.DirectionalLight(0xffe0b0,1.2);
sun.position.set(20,30,10);
sun.castShadow = true;
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
new THREE.MeshStandardMaterial({color:0x4c8c4a})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* PLAYER */
const player = new THREE.Group();

const body = new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1),
new THREE.MeshStandardMaterial({color:0x2d5a27})
);

const head = new THREE.Mesh(
new THREE.SphereGeometry(0.35),
new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y = 1.2;

player.add(body, head);
scene.add(player);

/* RESOURCES */
let wood = 0;
let stone = 0;

const woodUI = document.getElementById("wood");
const stoneUI = document.getElementById("stone");

const trees = [];
const rocks = [];

/* TREES */
function createTree(x,z){
const tree = new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,2),
new THREE.MeshStandardMaterial({color:0x8b5a2b})
);

tree.position.set(x,1,z);
scene.add(tree);
trees.push(tree);
}

for(let i=0;i<50;i++){
createTree((Math.random()-0.5)*200,(Math.random()-0.5)*200);
}

/* ROCKS */
for(let i=0;i<40;i++){
const rock = new THREE.Mesh(
new THREE.DodecahedronGeometry(0.5 + Math.random()),
new THREE.MeshStandardMaterial({color:0x888888})
);

rock.position.set((Math.random()-0.5)*200,0.5,(Math.random()-0.5)*200);
scene.add(rock);
rocks.push(rock);
}

/* INPUT */
let inputX=0, inputZ=0;
const keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* JOYSTICK */
const stick=document.getElementById("stick");
const joystick=document.getElementById("joystick");

let dragging=false, center={x:0,y:0};

joystick.addEventListener("touchstart",()=>{
dragging=true;
const r=joystick.getBoundingClientRect();
center.x=r.left+r.width/2;
center.y=r.top+r.height/2;
});

addEventListener("touchmove",e=>{
if(!dragging) return;

const t=e.touches[0];
let dx=t.clientX-center.x;
let dy=t.clientY-center.y;

const max=40;
const dist=Math.hypot(dx,dy);

if(dist>max){ dx*=max/dist; dy*=max/dist; }

stick.style.transform=`translate(${dx}px,${dy}px)`;

inputX=dx/max;
inputZ=-(dy/max);
});

addEventListener("touchend",()=>{
dragging=false;
inputX=0;
inputZ=0;
stick.style.transform="translate(0,0)";
});

/* MOVEMENT */
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();

function updateMovement(){

let kx=(keys["d"]?1:0)-(keys["a"]?1:0);
let kz=(keys["w"]?1:0)-(keys["s"]?1:0);

let x=dragging?inputX:kx;
let z=dragging?inputZ:kz;

const forward=new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y=0;
forward.normalize();

const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

direction.set(0,0,0);
direction.addScaledVector(forward,z);
direction.addScaledVector(right,x);

if(direction.length()>0) direction.normalize();

velocity.lerp(direction.multiplyScalar(0.18),0.2);

player.position.add(velocity);

if(velocity.length()>0.01){
const angle=Math.atan2(velocity.x,velocity.z);
player.rotation.y += (angle-player.rotation.y)*0.2;
}
}

/* COLETA */
function collectResources(){

trees.forEach((tree,i)=>{
if(tree.position.distanceTo(player.position)<2){
scene.remove(tree);
trees.splice(i,1);
wood+=5;
woodUI.textContent=wood;
}
});

rocks.forEach((rock,i)=>{
if(rock.position.distanceTo(player.position)<2){
scene.remove(rock);
rocks.splice(i,1);
stone+=3;
stoneUI.textContent=stone;
}
});
}

/* CAMERA */
function updateCamera(){
const offset=new THREE.Vector3(0,4,-7);
const target=player.position.clone().add(offset);

camera.position.lerp(target,0.1);
camera.lookAt(player.position);
}

/* LOOP */
function animate(){
requestAnimationFrame(animate);

updateMovement();
collectResources();
updateCamera();

renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
