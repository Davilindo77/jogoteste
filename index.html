<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Fixed</title>

<style>
body { margin:0; overflow:hidden; background:#87b97f; touch-action:none; }

#joystick {
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
}

#stick {
position:absolute;
width:60px;
height:60px;
left:30px;
top:30px;
border-radius:50%;
background:rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<div id="joystick"><div id="stick"></div></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa7d0a8);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const sun = new THREE.DirectionalLight(0xffffff,1);
sun.position.set(50,50,50);
scene.add(sun);

/* CHÃO */
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
new THREE.MeshStandardMaterial({color:0x4c8c4a})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* PLAYER (melhor simples) */
const player = new THREE.Group();

const body = new THREE.Mesh(
new THREE.CapsuleGeometry(0.4,1),
new THREE.MeshStandardMaterial({color:0x3a7a3a})
);

const head = new THREE.Mesh(
new THREE.SphereGeometry(0.35),
new THREE.MeshStandardMaterial({color:0xffcc99})
);

head.position.y = 1.2;

player.add(body, head);
scene.add(player);

/* INPUT */
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* JOYSTICK */
let inputX=0,inputZ=0;
const stick=document.getElementById("stick");
const joystick=document.getElementById("joystick");

let dragging=false,center={x:0,y:0};

joystick.addEventListener("touchstart",()=>{
dragging=true;
const r=joystick.getBoundingClientRect();
center.x=r.left+r.width/2;
center.y=r.top+r.height/2;
});

addEventListener("touchmove",e=>{
if(!dragging) return;
const t=e.touches[0];

let dx=t.clientX-center.x;
let dy=t.clientY-center.y;

const max=40;
const dist=Math.hypot(dx,dy);

if(dist>max){ dx*=max/dist; dy*=max/dist; }

stick.style.transform=`translate(${dx}px,${dy}px)`;

inputX=dx/max;
inputZ=-(dy/max);
});

addEventListener("touchend",()=>{
dragging=false;
inputX=0;
inputZ=0;
stick.style.transform="translate(0,0)";
});

/* CAMERA CONTROLE */
let camYaw = 0;
let camPitch = 0.5;
let rotating=false;

addEventListener("mousedown",()=>rotating=true);
addEventListener("mouseup",()=>rotating=false);

addEventListener("mousemove",e=>{
if(!rotating) return;
camYaw -= e.movementX*0.005;
camPitch -= e.movementY*0.005;
camPitch=Math.max(0.2,Math.min(1.2,camPitch));
});

/* MOBILE CAMERA */
let lastTouch=null;

addEventListener("touchstart",e=>{
if(e.touches.length===1) lastTouch=e.touches[0];
});

addEventListener("touchmove",e=>{
if(e.touches.length!==1 || dragging) return;

const t=e.touches[0];

if(lastTouch){
const dx=t.clientX-lastTouch.clientX;
const dy=t.clientY-lastTouch.clientY;

camYaw -= dx*0.005;
camPitch -= dy*0.005;
camPitch=Math.max(0.2,Math.min(1.2,camPitch));
}

lastTouch=t;
});

/* MOVIMENTO */
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();

function updateMovement(){

const kx=(keys["d"]?1:0)-(keys["a"]?1:0);
const kz=(keys["w"]?1:0)-(keys["s"]?1:0);

const x = dragging?inputX:kx;
const z = dragging?inputZ:kz;

const forward = new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));
const right = new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));

direction.set(0,0,0);
direction.addScaledVector(forward,z);
direction.addScaledVector(right,x);

if(direction.length()>0) direction.normalize();

velocity.lerp(direction.multiplyScalar(0.15),0.2);
player.position.add(velocity);

if(velocity.length()>0.01){
player.rotation.y = Math.atan2(velocity.x,velocity.z);
}
}

/* CAMERA */
function updateCamera(){
const dist=8;

const offset = new THREE.Vector3(
Math.sin(camYaw)*dist,
4+camPitch*3,
Math.cos(camYaw)*dist
);

camera.position.copy(player.position).add(offset);
camera.lookAt(player.position.x,player.position.y+1,player.position.z);
}

/* LOOP */
function animate(){
requestAnimationFrame(animate);
updateMovement();
updateCamera();
renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
