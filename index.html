<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Game Fixed</title>

<style>
body { margin:0; overflow:hidden; background:#87b97f; touch-action:none; }

#joystick {
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
}

#stick {
position:absolute;
width:60px;
height:60px;
left:30px;
top:30px;
border-radius:50%;
background:rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<div id="joystick"><div id="stick"></div></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b97f);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff,0.7));

const sun = new THREE.DirectionalLight(0xffffff,1);
sun.position.set(10,20,10);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({color:0x4c8c4a})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* PLAYER */
const player = new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1),
new THREE.MeshStandardMaterial({color:0x2d5a27})
);
scene.add(player);

/* TREES */
for(let i=0;i<40;i++){
const tree = new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,2),
new THREE.MeshStandardMaterial({color:0x8b5a2b})
);
tree.position.set((Math.random()-0.5)*100,1,(Math.random()-0.5)*100);
scene.add(tree);
}

/* INPUT */
let inputX=0, inputZ=0;
const keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* JOYSTICK */
const stick=document.getElementById("stick");
const joystick=document.getElementById("joystick");

let dragging=false, center={x:0,y:0};

joystick.addEventListener("touchstart",e=>{
dragging=true;
const r=joystick.getBoundingClientRect();
center.x=r.left+r.width/2;
center.y=r.top+r.height/2;
});

addEventListener("touchmove",e=>{
if(!dragging) return;

const t=e.touches[0];
let dx=t.clientX-center.x;
let dy=t.clientY-center.y;

const max=40;
const dist=Math.hypot(dx,dy);

if(dist>max){ dx*=max/dist; dy*=max/dist; }

stick.style.transform=`translate(${dx}px,${dy}px)`;

inputX=dx/max;
inputZ=-(dy/max);

if(Math.abs(inputX)<0.1) inputX=0;
if(Math.abs(inputZ)<0.1) inputZ=0;
});

addEventListener("touchend",()=>{
dragging=false;
inputX=0;
inputZ=0;
stick.style.transform="translate(0,0)";
});

/* MOVEMENT */
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();

function updateMovement(){

let kx=(keys["d"]?1:0)-(keys["a"]?1:0);
let kz=(keys["s"]?1:0)-(keys["w"]?1:0);

let x=dragging?inputX:kx;
let z=dragging?inputZ:kz;

if(Math.abs(x)<0.05) x=0;
if(Math.abs(z)<0.05) z=0;

const forward=new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y=0;
forward.normalize();

const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

direction.set(0,0,0);
direction.addScaledVector(forward,z);
direction.addScaledVector(right,x);

if(direction.length()>0) direction.normalize();

const speed=0.15;
const target=direction.multiplyScalar(speed);

velocity.lerp(target,0.2);

if(direction.length()===0) velocity.multiplyScalar(0.85);

if(velocity.length()<0.001) velocity.set(0,0,0);

player.position.add(velocity);

if(velocity.length()>0.01){
const angle=Math.atan2(velocity.x,velocity.z);
player.rotation.y += (angle-player.rotation.y)*0.2;
}
}

/* CAMERA */
function updateCamera(){
const offset=new THREE.Vector3(0,3,-6);
const target=player.position.clone().add(offset);

camera.position.lerp(target,0.1);
camera.lookAt(player.position);
}

/* LOOP */
function animate(){
requestAnimationFrame(animate);
updateMovement();
updateCamera();
renderer.render(scene,camera);
}
animate();

/* RESIZE */
addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
