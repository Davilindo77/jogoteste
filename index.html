<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Survival com Crafting</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#ui {
position:absolute; top:10px; left:10px;
color:white; font-family:sans-serif;
text-shadow:2px 2px 4px black;
}
</style>
</head>
<body>

<div id="ui"></div>

<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.160.0/build/three.module.js"
}
}
</script>

<script type="module">
import * as THREE from 'three';

// ===== CENA =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// câmera
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

// renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// luz
scene.add(new THREE.HemisphereLight(0x87ceeb,0x444444,1));
scene.add(new THREE.AmbientLight(0xffffff,0.5));

// chão
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({color:0x3f8f4f})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ===== PLAYER =====
let velocity = new THREE.Vector3();
let keys = {};
let hunger = 100;

// inventário
let inv = {wood:0, stone:0};
let tools = {axe:false, pickaxe:false};

// ===== OBJETOS =====
let resources = [];

function createTree(x,z){
const m = new THREE.Mesh(
new THREE.CylinderGeometry(0.5,0.5,3),
new THREE.MeshStandardMaterial({color:0x5a3825})
);
m.position.set(x,1.5,z);
scene.add(m);
resources.push({mesh:m,type:"wood",hp:3});
}

function createRock(x,z){
const m = new THREE.Mesh(
new THREE.DodecahedronGeometry(1),
new THREE.MeshStandardMaterial({color:0x777777})
);
m.position.set(x,1,z);
scene.add(m);
resources.push({mesh:m,type:"stone",hp:3});
}

// spawn
for(let i=0;i<50;i++){
createTree((Math.random()-0.5)*200,(Math.random()-0.5)*200);
createRock((Math.random()-0.5)*200,(Math.random()-0.5)*200);
}

// ===== CONTROLES =====
document.body.onclick = ()=>document.body.requestPointerLock();

let rotX=0, rotY=0;

document.addEventListener("mousemove", e=>{
if(document.pointerLockElement){
rotY -= e.movementX*0.002;
rotX -= e.movementY*0.002;
rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
}
});

document.addEventListener("keydown", e=>{
keys[e.code]=true;

// crafting
if(e.code==="Digit1" && inv.wood>=5 && inv.stone>=2){
inv.wood-=5; inv.stone-=2;
tools.axe=true;
}

if(e.code==="Digit2" && inv.wood>=3 && inv.stone>=5){
inv.wood-=3; inv.stone-=5;
tools.pickaxe=true;
}

if(e.code==="Digit3" && inv.wood>=5){
inv.wood-=5;
const fire = new THREE.Mesh(
new THREE.SphereGeometry(1),
new THREE.MeshBasicMaterial({color:0xff5500})
);
fire.position.copy(camera.position);
scene.add(fire);
}
});

document.addEventListener("keyup", e=>keys[e.code]=false);

// ===== LOOP =====
function animate(){
requestAnimationFrame(animate);

camera.rotation.x = rotX;
camera.rotation.y = rotY;

// movimento
const speed = 0.15;
if(keys["KeyW"]) camera.translateZ(-speed);
if(keys["KeyS"]) camera.translateZ(speed);
if(keys["KeyA"]) camera.translateX(-speed);
if(keys["KeyD"]) camera.translateX(speed);

// fome
hunger -= 0.01;

// coleta com E
if(keys["KeyE"]){
resources.forEach((r,i)=>{
if(camera.position.distanceTo(r.mesh.position)<3){
let dmg = 1;

if(r.type==="wood" && tools.axe) dmg=2;
if(r.type==="stone" && tools.pickaxe) dmg=2;

r.hp -= dmg;

if(r.hp<=0){
inv[r.type]++;
scene.remove(r.mesh);
resources.splice(i,1);
}
}
});
}

// UI
document.getElementById("ui").innerHTML =
`🍗 Fome: ${Math.floor(hunger)}<br>
🌲 Madeira: ${inv.wood}<br>
🪨 Pedra: ${inv.stone}<br><br>
🔨 Machado: ${tools.axe ? "SIM" : "NÃO"}<br>
⛏️ Picareta: ${tools.pickaxe ? "SIM" : "NÃO"}<br><br>
1 = Machado<br>
2 = Picareta<br>
3 = Fogueira<br>
E = Coletar`;

renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
