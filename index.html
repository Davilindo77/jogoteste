<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Upgrade 3</title>

<style>
body { margin:0; overflow:hidden; background:#87b97f; touch-action:none; }

/* UI */
#ui {
position:absolute;
top:10px;
left:10px;
color:white;
font-family:sans-serif;
text-shadow:2px 2px 4px black;
}

/* joystick */
#joystick {
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
}

#stick {
position:absolute;
width:60px;
height:60px;
left:30px;
top:30px;
border-radius:50%;
background:rgba(255,255,255,0.5);
}

/* botão ataque */
#hitBtn {
position:absolute;
bottom:60px;
right:40px;
width:80px;
height:80px;
border-radius:50%;
background:rgba(255,255,255,0.3);
font-size:22px;
}
</style>
</head>

<body>

<div id="ui">🪵 Madeira: <span id="wood">0</span></div>
<div id="joystick"><div id="stick"></div></div>
<button id="hitBtn">⛏</button>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

/* =========================
SCENE
========================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa7d0a8);
scene.fog = new THREE.Fog(0xa7d0a8, 60, 250);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xcfead6,0.6));

const sun = new THREE.DirectionalLight(0xffe8b5,1.4);
sun.position.set(50,80,30);
sun.castShadow = true;
scene.add(sun);

/* =========================
CHÃO
========================= */
const loader = new THREE.TextureLoader();
const grass = loader.load("https://threejs.org/examples/textures/terrain/grasslight-big.jpg");
grass.wrapS = grass.wrapT = THREE.RepeatWrapping;
grass.repeat.set(60,60);

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(600,600),
new THREE.MeshStandardMaterial({map:grass})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* =========================
PLAYER (MELHORADO)
========================= */
const player = new THREE.Group();

/* corpo */
const body = new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1.2),
new THREE.MeshStandardMaterial({color:0x2f5d2f})
);

/* cabeça */
const head = new THREE.Mesh(
new THREE.SphereGeometry(0.4),
new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y = 1.5;

/* olhos (simples mas dá vida) */
const eyeGeo = new THREE.SphereGeometry(0.05);

const eye1 = new THREE.Mesh(eyeGeo, new THREE.MeshBasicMaterial({color:0x000000}));
const eye2 = eye1.clone();

eye1.position.set(-0.1,1.55,0.35);
eye2.position.set(0.1,1.55,0.35);

/* braços */
const armGeo = new THREE.CylinderGeometry(0.1,0.1,0.8);

const armL = new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({color:0x2f5d2f}));
const armR = armL.clone();

armL.position.set(-0.6,0.8,0);
armR.position.set(0.6,0.8,0);

player.add(body, head, eye1, eye2, armL, armR);
scene.add(player);

/* =========================
TREES + INTERAÇÃO
========================= */
const trees = [];

function createTree(x,z){
const tree = new THREE.Group();

const trunk = new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,4),
new THREE.MeshStandardMaterial({color:0x5c3b1e})
);

const leaves = new THREE.Mesh(
new THREE.SphereGeometry(1.6),
new THREE.MeshStandardMaterial({color:0x2e7d32})
);

leaves.position.y = 3;

tree.add(trunk, leaves);
tree.position.set(x,1,z);

tree.userData.hp = 5;

scene.add(tree);
trees.push(tree);
}

for(let i=0;i<120;i++){
createTree((Math.random()-0.5)*500,(Math.random()-0.5)*500);
}

/* =========================
SISTEMA DE CORTE
========================= */
let wood = 0;
const woodUI = document.getElementById("wood");
let canHit = true;

function hitTree(){
if(!canHit) return;

trees.forEach((tree,i)=>{
if(tree.position.distanceTo(player.position) < 3){
canHit = false;

tree.userData.hp--;
tree.rotation.z = 0.1;
setTimeout(()=>tree.rotation.z=0,100);

if(tree.userData.hp <= 0){
scene.remove(tree);
trees.splice(i,1);

wood += 5;
woodUI.textContent = wood;
}

setTimeout(()=>canHit = true,400);
}
});
}

addEventListener("keydown",e=>{
if(e.key === "e") hitTree();
});

document.getElementById("hitBtn").addEventListener("click", hitTree);

/* =========================
CONTROLES MOVIMENTO
========================= */
let inputX=0,inputZ=0;
const keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* =========================
CONTROLE DE CÂMERA (NOVO)
========================= */
let camYaw = 0;
let camPitch = 0.4;

addEventListener("mousemove", e=>{
if(e.buttons !== 1) return; // só arrastando

camYaw -= e.movementX * 0.005;
camPitch -= e.movementY * 0.005;

camPitch = Math.max(0.2, Math.min(1.2, camPitch));
});

/* MOBILE */
addEventListener("touchmove", e=>{
if(e.touches.length !== 1) return;

const t = e.touches[0];

camYaw -= t.movementX * 0.002 || 0;
});

/* =========================
MOVIMENTO
========================= */
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();

function updateMovement(){

let kx=(keys["d"]?1:0)-(keys["a"]?1:0);
let kz=(keys["w"]?1:0)-(keys["s"]?1:0);

let x=inputX || kx;
let z=inputZ || kz;

const forward = new THREE.Vector3(
Math.sin(camYaw),
0,
Math.cos(camYaw)
);

const right = new THREE.Vector3(
Math.cos(camYaw),
0,
-Math.sin(camYaw)
);

direction.set(0,0,0);
direction.addScaledVector(forward,z);
direction.addScaledVector(right,x);

if(direction.length()>0) direction.normalize();

velocity.lerp(direction.multiplyScalar(0.2),0.2);
player.position.add(velocity);

if(velocity.length()>0.01){
const angle=Math.atan2(velocity.x,velocity.z);
player.rotation.y += (angle-player.rotation.y)*0.2;
}
}

/* =========================
CAMERA (LIVRE)
========================= */
function updateCamera(){

const distance = 8;

const offset = new THREE.Vector3(
Math.sin(camYaw) * distance,
4 + camPitch*2,
Math.cos(camYaw) * distance
);

const target = player.position.clone().add(offset);

camera.position.lerp(target,0.1);
camera.lookAt(player.position.x, player.position.y+1, player.position.z);
}

/* =========================
LOOP
========================= */
function animate(){
requestAnimationFrame(animate);
updateMovement();
updateCamera();
renderer.render(scene,camera);
}
animate();

/* RESIZE */
addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
