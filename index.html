<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Upgrade 2</title>

<style>
body { margin:0; overflow:hidden; background:#87b97f; touch-action:none; }

#joystick {
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
}

#stick {
position:absolute;
width:60px;
height:60px;
left:30px;
top:30px;
border-radius:50%;
background:rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<div id="joystick"><div id="stick"></div></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa7d0a8);
scene.fog = new THREE.Fog(0xa7d0a8, 60, 250);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xcfead6,0.6));

const sun = new THREE.DirectionalLight(0xffe8b5,1.4);
sun.position.set(50,80,30);
sun.castShadow = true;
scene.add(sun);

/* TEXTURA CHÃO */
const loader = new THREE.TextureLoader();
const grass = loader.load("https://threejs.org/examples/textures/terrain/grasslight-big.jpg");
grass.wrapS = grass.wrapT = THREE.RepeatWrapping;
grass.repeat.set(60,60);

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(600,600),
new THREE.MeshStandardMaterial({map:grass})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* PLAYER */
const player = new THREE.Group();

const body = new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1),
new THREE.MeshStandardMaterial({color:0x2f5d2f})
);

const head = new THREE.Mesh(
new THREE.SphereGeometry(0.35),
new THREE.MeshStandardMaterial({color:0xffcc99})
);

head.position.y = 1.2;
player.add(body, head);
scene.add(player);

/* 🌲 ÁRVORES MELHORADAS */
function createTree(x,z){
const tree = new THREE.Group();

const trunk = new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,4),
new THREE.MeshStandardMaterial({color:0x5c3b1e})
);

const leaves1 = new THREE.Mesh(
new THREE.SphereGeometry(1.5),
new THREE.MeshStandardMaterial({color:0x2e7d32})
);

const leaves2 = new THREE.Mesh(
new THREE.SphereGeometry(1.2),
new THREE.MeshStandardMaterial({color:0x388e3c})
);

leaves1.position.y = 2.5;
leaves2.position.y = 3.5;

tree.add(trunk, leaves1, leaves2);
tree.position.set(x,1,z);

scene.add(tree);
}

for(let i=0;i<150;i++){
createTree((Math.random()-0.5)*500,(Math.random()-0.5)*500);
}

/* 🪨 PEDRAS */
for(let i=0;i<100;i++){
const rock = new THREE.Mesh(
new THREE.DodecahedronGeometry(0.5 + Math.random()),
new THREE.MeshStandardMaterial({color:0x666666, roughness:1})
);

rock.position.set(
(Math.random()-0.5)*500,
0.5,
(Math.random()-0.5)*500
);

rock.scale.y *= 0.5;
scene.add(rock);
}

/* 🌱 GRAMA MELHOR DISTRIBUÍDA */
for(let i=0;i<300;i++){
const g = new THREE.Mesh(
new THREE.PlaneGeometry(1,1.5),
new THREE.MeshBasicMaterial({color:0x2e7d32, side:THREE.DoubleSide})
);

g.position.set(
(Math.random()-0.5)*500,
0.5,
(Math.random()-0.5)*500
);

g.rotation.y = Math.random()*Math.PI;
scene.add(g);
}

/* INPUT */
let inputX=0,inputZ=0;
const keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* JOYSTICK */
const stick=document.getElementById("stick");
const joystick=document.getElementById("joystick");

let dragging=false,center={x:0,y:0};

joystick.addEventListener("touchstart",()=>{
dragging=true;
const r=joystick.getBoundingClientRect();
center.x=r.left+r.width/2;
center.y=r.top+r.height/2;
});

addEventListener("touchmove",e=>{
if(!dragging) return;
const t=e.touches[0];

let dx=t.clientX-center.x;
let dy=t.clientY-center.y;

const max=40;
const dist=Math.hypot(dx,dy);

if(dist>max){ dx*=max/dist; dy*=max/dist; }

stick.style.transform=`translate(${dx}px,${dy}px)`;

inputX=dx/max;
inputZ=-(dy/max);
});

addEventListener("touchend",()=>{
dragging=false;
inputX=0;
inputZ=0;
stick.style.transform="translate(0,0)";
});

/* MOVIMENTO */
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();

function updateMovement(){
let kx=(keys["d"]?1:0)-(keys["a"]?1:0);
let kz=(keys["w"]?1:0)-(keys["s"]?1:0);

let x=dragging?inputX:kx;
let z=dragging?inputZ:kz;

const forward=new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y=0;
forward.normalize();

const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

direction.set(0,0,0);
direction.addScaledVector(forward,z);
direction.addScaledVector(right,x);

if(direction.length()>0) direction.normalize();

velocity.lerp(direction.multiplyScalar(0.2),0.2);
player.position.add(velocity);

if(velocity.length()>0.01){
const angle=Math.atan2(velocity.x,velocity.z);
player.rotation.y += (angle-player.rotation.y)*0.2;
}
}

/* CAMERA */
function updateCamera(){
const offset=new THREE.Vector3(0,5,-9);
const target=player.position.clone().add(offset);

camera.position.lerp(target,0.1);
camera.lookAt(player.position);
}

/* LOOP */
function animate(){
requestAnimationFrame(animate);
updateMovement();
updateCamera();
renderer.render(scene,camera);
}
animate();

/* RESIZE */
addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
